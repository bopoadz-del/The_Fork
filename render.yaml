# Render Blueprint — version-controlled deploy config for The Shovel / The Fork.
#
# Purpose: make the production service reproducible and the env surface
# reviewable. Secrets are `sync: false` — they are entered once in the Render
# dashboard and never live in this file or git. Non-secret values below are
# safe infra config or match the application's code defaults.
#
# 2026-08-09 — Postgres moved OFF Render to Neon, and the background worker
# was dropped. The stack is now exactly two Render resources:
#
#   * one WEB service (the-fork)  — the only compute
#   * one REDIS instance          — cache, sessions, rate-limit window
#
# The database is external: DATABASE_URL is `sync: false` and holds the Neon
# DIRECT connection string (not the `-pooler` host — psycopg3 prepares
# statements automatically, which transaction-mode poolers can reject).
#
# WHY NO WORKER: the worker existed only to drain the arq ingest queue so
# uploads processed in the background. At pilot scale, inline ingestion in
# the web request is acceptable, and dropping it halves the compute bill.
# Redis stays regardless — sessions and rate limiting use it too. To bring
# the worker back, restore the `type: worker` block from git history
# (present through 2026-08-08) and redeploy.
#
# NEON IS BILLED BY COMPUTE-TIME, NOT 24/7. That makes any endpoint which
# touches the database expensive to poll: every probe wakes the compute and
# starts a fresh billing window. `healthCheckPath` therefore points at
# `/livez`, which is deliberately DB-FREE — see app/routers/health.py. Do
# not repoint it at `/health` or `/ready`; both run a real `SELECT 1` and
# Render polls the health path continuously, which would hold Neon awake
# around the clock and defeat scale-to-zero entirely.

services:
  - type: redis
    name: the-fork-redis
    plan: free
    region: oregon

  - type: web
    name: the-fork
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    # Documentation-only commits must not redeploy a live client service.
    # Observed 2026-08-02: merging a markdown-only PR rebuilt the image and
    # returned 502 for ~40s. Nothing in this list can change runtime
    # behaviour, so skipping a rebuild for them costs nothing and removes a
    # self-inflicted outage per docs commit.
    #
    # NOTE: buildFilter applies to Render's auto-deploy trigger. It is
    # reconciled when this blueprint is applied — like every other change in
    # this file, it does not take effect from a git push alone.
    buildFilter:
      ignoredPaths:
        - "docs/**"
        - "review_pack/**"
        - "**/*.md"
        - "LICENSE"
        - ".github/**"
    # DB-FREE by design — see the Neon note in the header. `/health` and
    # `/ready` both execute a real `SELECT 1`; pointing Render's continuous
    # health check at either would keep Neon's compute awake permanently.
    healthCheckPath: /livez
    disk:
      name: the-fork-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # ── Infra config (safe to commit) ──────────────────────────────────
      - key: ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: PYTHONIOENCODING
        value: utf-8

      # ── Pilot master-corpus alias (match app/core/projects.py defaults) ─
      # NOTE: these are the intended live values; render.yaml env does NOT
      # auto-sync to the dashboard, so the live env must be set to match.
      - key: MASTER_CORPUS_PROJECT_ID
        value: master_corpus
      - key: MASTER_CORPUS_SOURCE_PROJECT_ID
        value: drive_archive
      - key: MASTER_CORPUS_NAME
        value: Master Corpus
      # GK = the always-on, DISCLOSED general-knowledge layer only: genuinely
      # cross-project reference (FIDIC / OSHA / units / rates) in `curated_kb`.
      # STEP 0 (2026-07-17): client corpora (drive_archive / client_infra_pack_1)
      # were removed from this list — they were silently merging the client project into every
      # other project (the ha_long -> the client project leak). The client/Master corpus now
      # surfaces ONLY as the labeled empty/thin fallback via
      # MASTER_CORPUS_SOURCE_PROJECT_ID; the retriever also structurally strips
      # that id from this list even if a stale env re-adds it. See
      # docs/step0-retrieval-isolation.md. Set to "" to make GK fallback-only too.
      - key: RAG_GENERAL_KNOWLEDGE_PROJECTS
        value: curated_kb
      # Phase 1 pilot: route the schedule workflow through the orchestrator's
      # predefined reasoning. Non-breaking (only intercepts high-confidence
      # generate_wbs intents); remove to revert to the tool-agent path.
      - key: ORCHESTRATOR_PREDEFINED
        value: "1"
      # Intent routing runs on every chat turn. The chat/answering model is
      # OLLAMA_MODEL=glm-5.2:cloud (Ollama Cloud); intent classification is
      # now pinned to the light gpt-oss:20b-cloud (20B MoE, ~3.6B active,
      # built for low-latency/agentic routing). The classifier request is
      # tiny (classifier prompt + the user message, not the project context),
      # so running it on the heavy model only added per-turn latency.
      # dynamic_reasoning.py falls back to the provider default when unset.
      # NOTE: render.yaml env does NOT auto-sync — set the same value in the
      # Render dashboard (or Apply the blueprint) for prod to pick it up.
      - key: ORCHESTRATOR_INTENT_MODEL
        value: gpt-oss:20b-cloud
      # Cap document uploads so one large BIM file can't OOM the box.
      - key: MAX_DOC_UPLOAD_SIZE
        value: "52428800" # 50 MB

      # ── Required in production (set in dashboard) ──────────────────────
      - key: SECRET_KEY # JWT signing — app refuses to start in prod without it
        sync: false
      - key: DATA_ENCRYPTION_KEY # encrypts uploaded files at rest
        sync: false
      - key: CEREBRUM_MASTER_KEY # admin API key
        sync: false

      # ── LLM providers (set in dashboard) ───────────────────────────────
      # The cloud ladder is exactly two providers (DECISIONS.md 2026-07-24):
      #   PRIMARY  = Kimi K2 on Moonshot's native API (LLM_PROVIDER=kimi,
      #              KIMI_MODEL=kimi-k2.6 — a reasoning model, so the runtime
      #              uses tool_choice=auto; forcing a specific tool 400s it).
      #   FALLBACK = Groq free tier (LLM_FALLBACK_PROVIDER=groq). Note the
      #              free account 413s payloads >~12k tokens across all its
      #              models — it catches normal-size turns, not large grounded
      #              ones (PLATFORM_HEALTH_REPORT F1a: Dev-tier upgrade lifts it).
      # No OpenAI, no DeepSeek — both removed 2026-07-25. Ollama is the
      # ON-PREM provider only (see deploy/onprem); it is not a cloud fallback.
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_FALLBACK_PROVIDER
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false

      # ── Google Drive integration (set in dashboard) ────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

      # ── Bootstrap admin + misc (set in dashboard) ──────────────────────
      - key: BOOTSTRAP_USER_EMAIL
        sync: false
      - key: BOOTSTRAP_USER_PASSWORD
        sync: false

      # ── Redis + worker infra (P5) ──────────────────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: the-fork-redis
          property: connectionString
      - key: UVICORN_WORKERS
        value: "2"
