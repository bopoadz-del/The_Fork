# Build the image and push it to ECR, then roll the ECS services.
#
# Replaces Render's auto-deploy-on-merge. Render built the image itself from
# this repo's Dockerfile; ECS pulls a prebuilt image, so the build moves into
# CI rather than depending on one machine having Docker.
#
# ONE image serves both the web service and the ingest worker — they are the
# same application with a different command, exactly as on Render, where the
# worker ran `python scripts/p1b_ingest_drive_server.py` against the same
# build. Building once keeps them from drifting apart. The ingest is a JOB:
# it is started once by ingest-run-once.yml, never kept running as a service
# (the service's desired count is pinned to 0 below).
#
# This does NOT touch DNS. theshovel.ai moves only when a human moves it.
name: deploy-aws

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: the-fork
  ECS_CLUSTER: cerebrum

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image carries Torch, transformers and OCR wheels; the hosted
      # runner's 14 GB disk fills during the build without this.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The detector weights are a release asset, not a git object (see
      # data/models/manifest.json). Fetch + sha256-verify them into the build
      # context; a mismatch fails here, and the Dockerfile re-checks it.
      - name: Fetch and verify model weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_model.py --image

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          # ECS sets none of the env vars the liveness route reads for build_sha
          # (RENDER_GIT_COMMIT, GIT_SHA, SOURCE_VERSION). Bake the commit.
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Retire env / secret refs from the web task definition
        # infra/retired_task_env.json lists the env / secret NAMES the web task
        # must no longer carry (RAG_SCRUB_RULES: the scrub rules are structural
        # now). When the live task definition still carries one, register a
        # revision identical except those entries and roll onto it. Values are
        # never printed: the definition goes to a 0600 file in RUNNER_TEMP and
        # the script prints names only.
        id: retire
        run: |
          svc=the-fork
          count=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$svc" \
            --query 'length(services[?status==`ACTIVE`])' --output text 2>/dev/null || echo 0)
          if [ "$count" != "1" ]; then
            echo "$svc: not created yet"
            exit 0
          fi
          umask 077
          td_arn=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$svc" --query 'services[0].taskDefinition' --output text)
          cur="$RUNNER_TEMP/td-current.json"
          new="$RUNNER_TEMP/td-retired.json"
          rm -f "$new"
          aws ecs describe-task-definition --task-definition "$td_arn" > "$cur"
          python3 scripts/retire_task_env.py \
            --retired infra/retired_task_env.json --taskdef "$cur" --out "$new"
          if [ -s "$new" ]; then
            new_arn=$(aws ecs register-task-definition \
              --cli-input-json "file://$new" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster "$ECS_CLUSTER" \
              --service "$svc" --task-definition "$new_arn" \
              --force-new-deployment >/dev/null
            echo "$svc: rolled onto $new_arn"
            echo "rolled=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$cur" "$new"

      - name: Roll the web service
        if: steps.retire.outputs.rolled != 'true'
        run: |
          for svc in the-fork; do
            count=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
              --services "$svc" \
              --query 'length(services[?status==`ACTIVE`])' --output text 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              aws ecs update-service --cluster "$ECS_CLUSTER" \
                --service "$svc" --force-new-deployment >/dev/null
              echo "$svc: deployment triggered"
            else
              echo "$svc: not created yet"
            fi
          done

      - name: Keep the ingest service at zero (ingest is a job, not a service)
        # Live 2026-10-03: this step used to roll `the-fork-ingest` too, and
        # the service's desired count of 1 restarted the one-shot ingest
        # script every time it finished -- ~95 min per lap, 50+ laps on
        # record, each `--resume`ing over the same files and rewriting the
        # project's doc_index blob per document (Neon: 876 GB egress in 3
        # days). The service row stays (its network configuration is reused
        # by ingest-run-once.yml); its desired count is pinned to 0 on every
        # deploy; an ingest runs ONCE via ingest-run-once.yml. Nothing may
        # raise this count.
        run: |
          svc=the-fork-ingest
          count=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$svc" \
            --query 'length(services[?status==`ACTIVE`])' --output text 2>/dev/null || echo 0)
          if [ "$count" = "1" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" \
              --service "$svc" --desired-count 0 >/dev/null
            echo "$svc: desired count pinned to 0 (run it with ingest-run-once)"
          else
            echo "$svc: not created"
          fi
