# Clean stored RAG text that the serve-time identifier scrub would match,
# then (later) retire RAG_SCRUB_RULES. Rules stay in the AWS secret.
# This job never prints a rule, a match, or row text — counts only.
#
# Modes (workflow_dispatch):
#   count   — matches split by layer (shared general-knowledge vs project-own)
#   clean   — requires confirm=CLEAN and the name of a Neon restore-point
#             branch the operator took first; then rewrite
#             matching SHARED rows in place (batched SQL UPDATE), regenerate
#             tsvector, re-embed changed ids. Never touches project-own rows.
#   dryrun  — shared-layer detector count (as if the serve-time list were empty)
#
# Reuses the AWS credentials deploy-aws uses. The live web task's env and
# secrets are loaded only inside this job and masked. No bulk data leaves
# the database (counts only).
name: scrub-at-source

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "count | clean | dryrun"
        type: choice
        options: [count, clean, dryrun]
        default: count
      confirm:
        description: "Must be CLEAN when mode is clean"
        type: string
        default: ""
      restore_branch:
        description: "Name of the Neon restore-point branch taken before a clean"
        type: string
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECS_CLUSTER: cerebrum
  ECS_SERVICE: the-fork
  PYTHONUNBUFFERED: "1"

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Requirements
        run: python -m pip install -q -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load live task env (values masked, never printed)
        run: |
          set +x
          python scripts/load_live_task_env.py --github-env "$GITHUB_ENV"

      - name: Restore point required for clean
        if: ${{ inputs.mode == 'clean' }}
        env:
          RESTORE_BRANCH: ${{ inputs.restore_branch }}
        run: |
          # The Neon restore-point branch is made by the operator before a
          # clean (the Neon key never comes to GitHub). Its name is recorded
          # here; a clean without one does not start.
          if [ -z "$RESTORE_BRANCH" ]; then
            echo "SCRUB_AT_SOURCE error=restore_branch_required"; exit 2
          fi
          echo "SCRUB_AT_SOURCE restore_branch=$RESTORE_BRANCH"

      - name: Run (counts only)
        env:
          SCRUB_MODE: ${{ inputs.mode }}
          SCRUB_CONFIRM: ${{ inputs.confirm }}
        run: |
          set +x
          python scripts/scrub_at_source.py --mode "$SCRUB_MODE" --confirm "$SCRUB_CONFIRM"
