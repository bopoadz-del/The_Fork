name: health-watch

# Minimum-viable production alerting, from the repo side.
#
# The 2026-08-04 PRR found that nothing pages a human when the live service
# degrades: /health deliberately always returns 200 (it is Render's liveness
# probe — see app/routers/health.py), so Render's own health alerting can
# never fire on a degraded-but-up service, and Sentry only emails on ERROR
# events. An outage was discoverable only by the client.
#
# This workflow polls the fail-closed readiness endpoint (/ready → 503 when
# the database is unreachable) on a schedule. When it fails, GitHub notifies
# the repository owner (default notification setting for failed scheduled
# workflows on watched repos). It is deliberately dumb: no thresholds, no
# state — two attempts a minute apart so a single blip doesn't page.
#
# This does NOT replace real alerting (Render notifications + a Sentry alert
# rule are dashboard-side, operator-gated). It replaces *nothing*.

# 2026-08-09 — the database is Neon now, billed by compute-time and suspended
# when idle. This workflow used to poll /ready every 15 minutes; /ready runs a
# real SELECT 1, so that was 96 forced wake-ups a day, each starting a fresh
# billing window. On a scale-to-zero database an uptime monitor can quietly
# cost more than the traffic it is watching.
#
# So the probes are split by what they actually cost:
#   * every 15 min  -> /livez   (DB-FREE; catches process/host down)
#   * every 6 hours -> /ready   (fail-closed SELECT 1; catches DB down)
#
# Four DB wake-ups a day is a rounding error; a dead database is still caught
# within six hours, and a dead SERVICE is still caught within fifteen minutes.

on:
  schedule:
    - cron: "*/15 * * * *"   # liveness — DB-free
    - cron: "7 */6 * * *"    # readiness — touches the database
  workflow_dispatch:
    inputs:
      deep:
        description: "Also run the DB-touching /ready probe"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BASE_URL: https://the-fork-jn3t.onrender.com
  # The CLIENT-FACING hostname. Probing only the onrender slug is structurally
  # blind to the things that actually take the product down for a client: a
  # Cloudflare record pointing at a dead host (which is exactly what happened
  # from 2026-08-09 to 2026-08-14), a lapsed custom-domain attachment, or an
  # expired certificate. The slug can be perfectly healthy through all three.
  PUBLIC_URL: https://theshovel.ai

jobs:
  liveness:
    # Runs on every trigger — it costs nothing on the database side.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /livez (DB-free liveness)
        run: |
          url="$BASE_URL/livez"
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/livez.json -w '%{http_code}' --max-time 30 "$url" || echo "000")
            echo "attempt $attempt: GET $url -> $code"
            cat /tmp/livez.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            # One retry a minute later so a transient blip doesn't page.
            [ "$attempt" = "1" ] && sleep 60
          done
          echo "::error::/livez returned $code twice — the service is not serving HTTP at all. Check the Render dashboard for the-fork."
          exit 1

  public-domain:
    # Same 15-minute cadence and same DB-free endpoint as `liveness`, but over
    # the hostname clients actually use. Deliberately a SEPARATE job so the
    # failure names the layer: liveness red = the service is down; this red
    # while liveness is green = DNS, the custom-domain binding, or TLS.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /livez over the public domain (DNS + custom domain + TLS)
        run: |
          url="$PUBLIC_URL/livez"
          for attempt in 1 2; do
            # --fail-with-body so a TLS or DNS failure is a non-zero exit, not
            # a 000 that reads like a transient blip.
            code=$(curl -sS -o /tmp/pub.json -w '%{http_code}' --max-time 30 "$url" || echo "000")
            echo "attempt $attempt: GET $url -> $code"
            cat /tmp/pub.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            [ "$attempt" = "1" ] && sleep 60
          done
          echo "::error::$PUBLIC_URL/livez returned $code twice while the onrender slug may still be healthy. Check Cloudflare DNS for theshovel.ai (both apex and www should CNAME to the-fork-jn3t.onrender.com), the custom-domain binding on the Render service, and certificate validity."
          exit 1

  readiness:
    # ONLY on the 6-hourly cron or an explicit deep dispatch. Guarding on the
    # cron expression is what keeps this off the 15-minute schedule.
    if: >-
      github.event.schedule == '7 */6 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.deep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /ready (fail-closed — wakes the Neon compute)
        run: |
          url="$BASE_URL/ready"
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 45 "$url" || echo "000")
            echo "attempt $attempt: GET $url -> $code"
            cat /tmp/ready.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            # Longer first wait than the liveness probe: a suspended Neon
            # compute has to cold-start before the first query can succeed,
            # so an immediate retry would just re-observe the wake-up.
            [ "$attempt" = "1" ] && sleep 90
          done
          echo "::error::/ready returned $code twice — the app is up but the DATABASE is unreachable. Check the Neon dashboard (compute suspended/over quota?) and DATABASE_URL on the-fork."
          exit 1
