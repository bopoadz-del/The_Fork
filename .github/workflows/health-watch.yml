name: health-watch

# Minimum-viable production alerting, from the repo side.
#
# The DB-free liveness probe is /livez. The dependency probe is /ready
# (503 when the database is unreachable). Both are requested on
# https://theshovel.ai. curl does not follow redirects, so a 301 is not
# success, and --proto '=https' refuses an http URL.
#
# When a probe fails, GitHub notifies the repository owner (default
# notification setting for failed scheduled workflows on watched repos).
# Two attempts a minute apart so a single blip doesn't page.
#
# 2026-08-09 — the database is billed by compute-time and suspended when
# idle. Polling /ready every 15 minutes was 96 forced wake-ups a day.
#
# So the probes are split by what they actually cost:
#   * every 15 min  -> /livez   (DB-FREE; catches process/host down)
#   * every 6 hours -> /ready   (fail-closed SELECT 1; catches DB down)
#
# Four DB wake-ups a day is a rounding error; a dead database is still caught
# within six hours, and a dead SERVICE is still caught within fifteen minutes.

on:
  schedule:
    - cron: "*/15 * * * *"   # liveness — DB-free
    - cron: "7 */6 * * *"    # readiness — touches the database
  workflow_dispatch:
    inputs:
      deep:
        description: "Also run the DB-touching /ready probe"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BASE_URL: https://theshovel.ai
  # The client-facing hostname. Probing it catches a DNS record pointing at
  # a dead host, a lapsed custom-domain attachment, or an expired certificate.
  PUBLIC_URL: https://theshovel.ai

jobs:
  liveness:
    # Runs on every trigger — it costs nothing on the database side.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /livez (DB-free liveness)
        run: |
          url="$BASE_URL/livez"
          for attempt in 1 2; do
            code=$(curl --proto '=https' -sS -o /tmp/livez.json -w '%{http_code}' --max-time 30 "$url" || echo "000")
            echo "attempt $attempt: GET $url -> $code"
            cat /tmp/livez.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            # One retry a minute later so a transient blip doesn't page.
            [ "$attempt" = "1" ] && sleep 60
          done
          echo "::error::/livez returned $code twice — the service is not serving HTTP at all."
          exit 1

  public-domain:
    # Same 15-minute cadence and same DB-free endpoint as `liveness`, but the
    # failure names the public hostname. Deliberately a SEPARATE job so the
    # failure names the layer: liveness red = the service is down; this red
    # while liveness is green = DNS, the custom-domain binding, or TLS.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /livez over the public domain (DNS + custom domain + TLS)
        run: |
          url="$PUBLIC_URL/livez"
          for attempt in 1 2; do
            code=$(curl --proto '=https' -sS -o /tmp/pub.json -w '%{http_code}' --max-time 30 "$url" || echo "000")
            echo "attempt $attempt: GET $url -> $code"
            cat /tmp/pub.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            [ "$attempt" = "1" ] && sleep 60
          done
          echo "::error::$PUBLIC_URL/livez returned $code twice. Check DNS for theshovel.ai (apex and www), the custom-domain binding, and certificate validity."
          exit 1

  readiness:
    # ONLY on the 6-hourly cron or an explicit deep dispatch. Guarding on the
    # cron expression is what keeps this off the 15-minute schedule.
    if: >-
      github.event.schedule == '7 */6 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.deep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /ready (fail-closed — wakes the database compute)
        run: |
          url="$BASE_URL/ready"
          for attempt in 1 2; do
            code=$(curl --proto '=https' -sS -o /tmp/ready.json -w '%{http_code}' --max-time 45 "$url" || echo "000")
            echo "attempt $attempt: GET $url -> $code"
            cat /tmp/ready.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            # Longer first wait than the liveness probe: a suspended database
            # compute has to cold-start before the first query can succeed,
            # so an immediate retry would just re-observe the wake-up.
            [ "$attempt" = "1" ] && sleep 90
          done
          echo "::error::/ready returned $code twice — the app is up but the DATABASE is unreachable."
          exit 1
