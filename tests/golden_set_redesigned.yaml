# Golden set — REDESIGN DRAFT (not yet wired into golden_set_gate.py).
#
# Run the same way as the current tests/golden_set.yaml, through the NORMAL
# chat path (POST /v1/agents/{agent}/chat/stream — nothing bypasses
# smart_orchestrator). Verdict per query: PASS iff
#   - EVERY regex in answer_expect matches the final answer text, and
#   - NO regex in answer_reject matches, and
#   - when retrieval_expect is set, a cited source (end-event sources list)
#     has a doc_name or doc_id containing it (case-insensitive substring).
# All regexes compiled with re.IGNORECASE | re.MULTILINE.
#
# ── WHY THIS EXISTS ──────────────────────────────────────────────────────
# The original 29-query set (docs/tests/golden_set.yaml) only sampled 12 of
# the 14 MUST-COVER actions in tests/feature_matrix_manifest.yaml (missing
# estimate_costs and commissioning_checklist entirely) and had zero coverage
# of the ~39 "coverage-class" actions. Most of its pilot-critical block used
# STRUCTURAL expects only (regex for "a number near currency", not a pinned
# fact) because the real dar_al_arkan_master corpus can't be independently
# verified from this repo — that constraint is real and still applies here.
#
# What changed: scripts/synthetic_fixtures.py generates DETERMINISTIC,
# fully-known content for the BOQ / Operations Pack / Programme+Drawings
# fixtures (same bytes every run — see that file's BUILDERS). That means
# every fact below pinned against those fixtures is computed directly from
# the generator's own source data in this file, not guessed, not taken from
# a live run, and not a claim about any real client document. Anything that
# still targets dar_al_arkan_master (the real corpus) stays structural —
# that rule is NOT relaxed here. One honest caveat: the pinned sums (BOQ
# total, VO pending value, payment-certificate math) are re-derived
# arithmetic on the generator's row data, done in this pass — worth ONE live
# spot-check against an actual seeded run before trusting them as gate truth,
# the same way you'd sanity-check a formula before shipping it.
#
# ── COMPOSITION (39 queries) ─────────────────────────────────────────────
#   A. 12 × fresh-upload grounding — UNCHANGED from the original set. This
#      block already meets the highest bar (pinned facts + verified
#      retrieval, against a fixture with fully known content) and tests a
#      different axis entirely: does the user's own document beat colliding
#      general-knowledge content. No reason to touch what already works.
#   B. 14 × must-cover features — ALL 14 from feature_matrix_manifest.yaml,
#      up from 12. Newly pinned where a synthetic fixture supports it
#      (boq_process, spec_analyze, drawing_qto, parse_primavera_schedule);
#      structural where only the real corpus applies or no fixture exists
#      (process_document, generate_wbs, resource_histogram,
#      cash_flow_forecast, procurement_list_generator, rfp_management,
#      commissioning_checklist); KB-verified where the ground truth lives in
#      app/knowledge/construction_kb.json (construction_advisor).
#   C. 8 × coverage-class sample — hand-picked from the ~39 remaining
#      registry actions, prioritising the two things worth a live-battery
#      LLM call: (1) money/number fabrication risk — the same failure class
#      that produced the cost_fabrication_concrete_rate regression guard
#      below, and (2) actions where a synthetic fixture now makes a pinned
#      check possible instead of "does it produce output at all."
#   D. 4 × demo-flow — UNCHANGED. Conversational-quality regression, not
#      fact-checking.
#   E. 1 × regression guard — UNCHANGED (cost_fabrication_concrete_rate).
#      Structured as a growing section: append here, don't invent a new
#      "incident" without a real one behind it.
#
# Explicitly OUT of scope for this pass, and why:
#   - bim_analysis / bim_extractor / bim_clash_detection — sample_office.ifc
#     is an OPTIONAL fixture file with no generator in synthetic_fixtures.py,
#     so its actual content is unknown from this repo. Pinning anything
#     against it would be a guess. Add once its content is known or a
#     generator exists.
#   - health_check, carbon_footprint_calculator, and most other coverage
#     actions — lower pilot-relevance or no safe way to pin; can be added
#     incrementally the same way this pass added its 8.
#
# Pilot bar: kept at >= 90% PASS, now against 39 (>= 36/39). Re-derive the
# exact integer bar once this is wired into golden_set_gate.py.

defaults:
  agent: project-assistant

queries:

  # ═══════════════════════════════════════════════════════════════════════
  # A. 12 × fresh-upload grounding (project "FIXTURE — Fresh Upload Eval")
  #    UNCHANGED from tests/golden_set.yaml — carried forward as-is.
  #    Ground truth: scripts/rag_fresh_upload_eval.py CASES.
  # ═══════════════════════════════════════════════════════════════════════

  - id: fresh_pier_mix_cement
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What is the cement content for the Pier P-217 concrete mix?"
    retrieval_expect: "P-217-pier-mix-design"
    answer_expect:
      - '385\s*kg'

  - id: fresh_r9_lighting_wattage
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What wattage LED fixture is specified for the Road R-9 lighting poles?"
    retrieval_expect: "road-R9-street-lighting"
    answer_expect:
      - '45\s*W'

  - id: fresh_eot_notice_period
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    # MANDATORY CASE — project-vs-GK disagreement regression (RAG_AUDIT_V2 s4).
    prompt: "Within how many days must the Contractor give notice of an EOT claim on this project?"
    retrieval_expect: "contract-eot-notice-period"
    answer_expect:
      - '21\s*days?'
    answer_reject:
      - 'within\s+28\s+days'
      - '28[-\s]day\s+(?:notice|period|time\s*bar)'

  - id: fresh_s4_manhole_spacing
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What is the maximum manhole spacing on sewer line S-4?"
    retrieval_expect: "sewer-S4-manhole-spacing"
    answer_expect:
      - '42\s*m\b'

  - id: fresh_design_review_codes
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What design review status codes are used on this project?"
    retrieval_expect: "design-review-status-codes"
    answer_expect:
      - 'CODE[-\s]?A'
      - 'CODE[-\s]?B'
      - 'CODE[-\s]?C'

  - id: fresh_excavation_rate
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What is the contract rate per m3 for excavation in ordinary soil?"
    retrieval_expect: "boq-excavation-rate"
    answer_expect:
      - 'SAR'
      - '27\.50?'

  - id: fresh_rebar_cover
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What is the minimum concrete cover for substructure elements in contact with soil?"
    retrieval_expect: "rebar-cover-substructure"
    answer_expect:
      - '75\s*mm'

  - id: fresh_wearing_course
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What thickness and type is the asphalt wearing course on this project?"
    retrieval_expect: "asphalt-wearing-course"
    answer_expect:
      - '60\s*mm'
      - 'polymer|PMB'

  - id: fresh_permit_to_work
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "How long is a permit-to-work valid on this project?"
    retrieval_expect: "hse-permit-to-work"
    answer_expect:
      - '12\s*hours?'

  - id: fresh_mv_soak_test
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "How long is the soak test required for the MV substation before taking-over?"
    retrieval_expect: "mv-substation-soak-test"
    answer_expect:
      - '5[-\s]?days?'

  - id: fresh_cpi_threshold
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "What CPI threshold triggers a corrective action plan on this project?"
    retrieval_expect: "evm-cpi-threshold"
    answer_expect:
      - '0\.92'

  - id: fresh_mass_concrete_curing
    feature: fresh_upload_grounding
    project: "FIXTURE — Fresh Upload Eval"
    prompt: "How many days must mass concrete pours be cured on this project?"
    retrieval_expect: "mass-concrete-curing"
    answer_expect:
      - '14\s*days?'

  # ═══════════════════════════════════════════════════════════════════════
  # B. 14 × must-cover (ALL of feature_matrix_manifest.yaml's `class: must`)
  # ═══════════════════════════════════════════════════════════════════════

  - id: must_process_document
    feature: process_document
    project: dar_al_arkan_master
    # Real corpus — structural only (unchanged rationale from the original set).
    prompt: "what does the DG2 project execution plan cover?"
    answer_expect:
      - 'execution plan'
      - '(scope|schedule|quality|risk|procurement|hse|safety|management|organi[sz]ation)'

  - id: must_boq_process
    feature: boq_process
    project: "FIXTURE — BOQ"
    # NEWLY PINNED. Ground truth: scripts/synthetic_fixtures.py _BOQ_ROWS,
    # 13 rows, sum(qty*rate) computed in this pass = SAR 6,938,130.00.
    # SPOT-CHECK BEFORE TRUSTING: re-derive against a live seeded run once.
    retrieval_expect: "synthetic_boq"
    prompt: "process the bill of quantities and give me the total package value"
    answer_expect:
      - '\bSAR\b'
      - '6,?938,?130(?:\.00?)?|6\.9\s*(?:million|M)\b'

  - id: must_estimate_costs
    feature: estimate_costs
    project: "FIXTURE — BOQ"
    # New scope not in the BOQ itself (a fresh sewer package) — no pinnable
    # ground truth exists for this; stays structural.
    prompt: "generate a cost estimate for a 2km 400mm sewer line in Riyadh"
    answer_expect:
      - '\b(SAR|USD|AED)\b'
      - '\d{1,3}(?:,\d{3}){1,}(?:\.\d+)?'

  - id: must_spec_analyze
    feature: spec_analyze
    project: "FIXTURE — Operations Pack"
    # NEWLY PINNED. Ground truth: synthetic_fixtures.py _SPEC_TEXT §2.1.B —
    # C32/40 min cementitious 380 kg/m3, w/c <= 0.45.
    retrieval_expect: "synthetic_spec_section_03_concrete"
    prompt: "analyze the concrete specification requirements - what grades and standards apply?"
    answer_expect:
      - 'C32/?40'
      - '380\s*kg|0\.45'
      - '\b(ASTM|BS|SASO)\b'

  - id: must_document_metadata
    feature: document_metadata
    project: "FIXTURE — Operations Pack"
    # SEMI-PINNED. The three required files are known (RFI register, VO log,
    # spec section) — require at least two of the three doc-type families to
    # be named, not just "a list exists."
    prompt: "list the documents in this project and what type each one is"
    answer_expect:
      - '(?m)^\s*(?:[-*•]|\d{1,3}[.)]|\|)\s*\S'
    # At least 2 of 3 known families named — checked as three separate
    # optional-style expects would over-constrain single-run phrasing, so
    # this uses one broad alternation covering all three; a run naming only
    # one of three would still need the list-row check above to pass, and a
    # human reviewer should spot-check the review_pack output for this one
    # rather than trust the regex alone — file-type diversity is inherently
    # harder to pin than a single fact.
      - '(RFI|rfi\s*register)|(variation|VO\s*log)|(spec(?:ification)?\s*section|CSI|03\s*30\s*00)'

  - id: must_generate_wbs
    feature: generate_wbs
    project: dar_al_arkan_master
    prompt: "generate a level 2 construction schedule for a 30-storey residential tower, 30 months"
    answer_expect:
      - '\d+\s*(?:working\s+)?(?:day|week|month)s?\b'
      - '(WBS|work breakdown|activit|phase)'
      - '(?m)^\s*(?:[-*•]|\d{1,3}[.)]|\|)\s*\S|critical path|man-days|ready to download'

  - id: must_resource_histogram
    feature: resource_histogram
    project: dar_al_arkan_master
    prompt: "produce a manpower histogram for the structure works over 12 months"
    answer_expect:
      - '\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b|\b(month|period|week)\s*[-#]?\s*\d{1,2}\b|\bM\d{1,2}\b|\bQ[1-4]\b'
      - '(manpower|labou?r|worker|crew|headcount|staff)'
      - '\d{2,}'

  - id: must_parse_primavera_schedule
    feature: parse_primavera_schedule
    project: "FIXTURE — Programme+Drawings"
    # SEMI-PINNED. tests/fixtures/resource_loaded.xer has NO zero-duration
    # milestone-type task (all 3 tasks carry real durations) — pinning a
    # specific "the milestone" would assume an interpretation the fixture
    # doesn't actually support. Instead: require at least one of the three
    # real task names AND one of the real dates from the XER, which is true
    # regardless of how the block chooses to define "milestone."
    retrieval_expect: "project_programme"
    prompt: "extract the key milestones from the project programme with their dates"
    answer_expect:
      - '(Excavation|Foundation\s*Concrete|Backfill)'
      - '2026-0[12]-\d{2}|2026-12-31|Feb(?:ruary)?\s+2[0-9]|Dec(?:ember)?\s+31'

  - id: must_cash_flow_forecast
    feature: cash_flow_forecast
    project: dar_al_arkan_master
    prompt: "build a cash flow forecast with an S-curve for a SAR 60M, 18-month project"
    answer_expect:
      - '(cumulative|cum\.|s[- ]?curve)'
      - '\b(month|period)\b|\bM\d{1,2}\b'
      - '%|\bSAR\b|\d{1,3}(?:,\d{3}){2,}|\b\d{7,}\b'

  - id: must_procurement_list_generator
    feature: procurement_list_generator
    project: dar_al_arkan_master
    prompt: "generate a procurement list for the MEP package"
    answer_expect:
      - '(?m)^\s*(?:[-*•]|\d{1,3}[.)]|\|)\s*\S'
      - '(procure|material|equipment|supplier|package|lead[\s-]?time)'

  - id: must_rfp_management
    feature: rfp_management
    project: dar_al_arkan_master
    prompt: "prepare an RFP for the landscaping subcontract package"
    answer_expect:
      - '(?m)^(?:#{1,6}\s+\S|(?:\*\*)?\d+(?:\.\d+)*[.)]?\s+[A-Z])'
      - '(scope of work|instructions to|evaluation|submission|tender|proposal)'

  - id: must_construction_advisor
    feature: construction_advisor
    project: dar_al_arkan_master
    # Ground truth VERIFIED in app/knowledge/construction_kb.json (unchanged).
    prompt: "for a 2.5m thick mass concrete raft, what thermal control limits apply and how long to equilibrium?"
    answer_expect:
      - '70\s*(?:°|deg(?:rees)?\s*)?C'
      - '20\s*(?:°|deg(?:rees)?\s*)?C'

  - id: must_drawing_qto
    feature: drawing_qto
    project: "FIXTURE — Programme+Drawings"
    # NEWLY PINNED. Ground truth: synthetic_fixtures.py build_ground_floor_dxf
    # — two closed SLAB polylines, 30x20m and 18x12m = 600 + 216 = 816 m2.
    # Accepts either the combined total or both bay areas stated separately.
    retrieval_expect: "ground_floor_plan"
    prompt: "measure the floor area from the ground floor plan drawing"
    answer_expect:
      - '(drawing|\.dxf|floor plan)'
      - '816(?:\.0)?\s*(?:m2|m²|sqm)|600.{0,40}216|216.{0,40}600'

  - id: must_commissioning_checklist
    feature: commissioning_checklist
    project: dar_al_arkan_master
    # No fixture-based ground truth exists for commissioning content — stays
    # structural. New addition (was entirely absent from the original set).
    prompt: "generate a commissioning checklist for the MV substation"
    answer_expect:
      - '(?m)^\s*(?:[-*•]|\d{1,3}[.)]|\[\s?\]|\|)\s*\S'
      - '(commission|T&C|test(?:ing)?\s*(?:and|&)\s*commission|energi[sz]e|inspection)'

  # ═══════════════════════════════════════════════════════════════════════
  # C. 8 × coverage-class sample — money/number fabrication risk first,
  #    then anything a synthetic fixture now makes pinnable.
  # ═══════════════════════════════════════════════════════════════════════

  - id: cov_payment_certificate
    feature: payment_certificate
    project: dar_al_arkan_master
    # PINNED via arithmetic, not a corpus claim: 25,000,000 * 0.42 =
    # 10,500,000 valued; * 0.10 retention = 1,050,000 held. Independent of
    # any fixture — this is checking the model's OWN math on stated inputs.
    prompt: "prepare an interim payment certificate for 42% progress on a SAR 25M contract with 10% retention"
    answer_expect:
      - '10,?500,?000|10\.5\s*(?:million|M)\b'
      - '1,?050,?000|1\.05\s*(?:million|M)\b'

  - id: cov_extract_quantities
    feature: extract_quantities
    project: "FIXTURE — BOQ"
    # NEWLY PINNED. Ground truth: _BOQ_ROWS item 2.03, "Reinforced concrete
    # C32/40 in ground slabs", qty 2400 m3.
    retrieval_expect: "synthetic_boq"
    prompt: "take off the concrete quantities for the ground floor slabs"
    answer_expect:
      - '2,?400\s*m3|2,?400\s*m³'

  - id: cov_variation_order_manager
    feature: variation_order_manager
    project: "FIXTURE — Operations Pack"
    # NEWLY PINNED. Ground truth: _VO_ROWS — VO-03 (-220,000, Pending) +
    # VO-04 (640,000, Pending) = 420,000 SAR open/pending value; 2 pending.
    retrieval_expect: "synthetic_variation_order_log"
    prompt: "update the variation log - what's the status and value of the open VOs?"
    answer_expect:
      - '420,?000|0\.42\s*(?:million|M)\b'
      - '\b2\b.{0,30}pending|pending.{0,30}\b2\b'

  - id: cov_rfi_management
    feature: rfi_management
    project: "FIXTURE — Operations Pack"
    # NEWLY PINNED. Ground truth: _RFI_ROWS — RFI-004 and RFI-005 are the
    # only two rows marked "Open — overdue"; 4 rows total are open (incl.
    # the two overdue).
    retrieval_expect: "synthetic_rfi_register"
    prompt: "how many RFIs are open and which ones are overdue?"
    answer_expect:
      - 'RFI-004'
      - 'RFI-005'

  - id: cov_change_order_impact
    feature: change_order_impact
    project: "FIXTURE — Operations Pack"
    # Structural by design: VO-12 does not exist in the synthetic log (the
    # real register only goes to VO-05), so this deliberately tests a
    # HYPOTHETICAL variation, not a lookup. A model that invents a specific
    # cost/time figure without flagging it as an estimate is the failure
    # mode this guards against — reject a bare confident number with no
    # estimate/assumption language.
    prompt: "assess the cost and time impact of variation order VO-12 adding 300m of storm drain"
    answer_expect:
      - '\d'
      - '(estimat|assum|approx|indicat|based on|similar\s+(?:item|rate|scope))'

  - id: cov_risk_register_auto_populate
    feature: risk_register_auto_populate
    project: dar_al_arkan_master
    prompt: "populate a risk register for deep excavation next to an existing hospital"
    answer_expect:
      - '(?m)^\s*(?:[-*•]|\d{1,3}[.)]|\|)\s*\S'
      - '(risk|mitigat|likelihood|impact)'

  - id: cov_safety_compliance_audit
    feature: safety_compliance_audit
    project: dar_al_arkan_master
    prompt: "run an HSE compliance audit checklist for working at height on the facade"
    answer_expect:
      - '(?m)^\s*(?:[-*•]|\d{1,3}[.)]|\[\s?\]|\|)\s*\S'
      - '(HSE|safety|fall\s*protection|working\s+at\s+height|harness|guardrail)'

  - id: cov_document_metadata_real_corpus
    feature: document_metadata
    project: dar_al_arkan_master
    # Second document_metadata check, deliberately against the REAL corpus
    # (not the Operations Pack fixture) — structural only, but exercises the
    # 2,700+ doc production path the fixture-based must_document_metadata
    # above does not touch.
    prompt: "which drawings do we have for the stormwater network?"
    answer_expect:
      - '(drawing|\.dwg|\.dxf|\.pdf)'
      - '(storm|stormwater|drain)'

  # ═══════════════════════════════════════════════════════════════════════
  # D. 4 × demo-flow — UNCHANGED. Conversational quality, not fact-pinning.
  # ═══════════════════════════════════════════════════════════════════════

  - id: demo_project_brief
    feature: demo_flow
    project: dar_al_arkan_master
    prompt: "what is this project about? give me a quick brief"
    answer_expect:
      - '(project|programme|development)'
      - '(scope|works|construct|infrastructure|building|road|residential|utilit)'

  - id: demo_biggest_cost_items
    feature: demo_flow
    project: dar_al_arkan_master
    prompt: "what are the biggest cost items on this project?"
    answer_expect:
      - '(cost|value|SAR|USD)'
      - '\d{1,3}(?:,\d{3})+|\d{4,}'

  - id: demo_open_risks
    feature: demo_flow
    project: dar_al_arkan_master
    prompt: "summarize the open risks on this project"
    answer_expect:
      - 'risk'
      - '(mitigat|impact|likelihood|priorit|contingen|action)'

  - id: demo_procure_first
    feature: demo_flow
    project: dar_al_arkan_master
    prompt: "what should we procure first on this project and why?"
    answer_expect:
      - '(procur|order|purchas)'
      - '(lead[\s-]?time|long[\s-]?lead|critical|early|first|priorit)'

  # ═══════════════════════════════════════════════════════════════════════
  # E. Regression guards — UNCHANGED. Append here when a real live incident
  #    produces a new one; do not invent a hypothetical incident.
  # ═══════════════════════════════════════════════════════════════════════

  - id: cost_fabrication_concrete_rate
    feature: cost_grounding
    project: dar_al_arkan_master
    # 2026-07-14 live incident: "kg/cm2" pulled a pipe-bend dimension table
    # to the top and the model lifted "450" from the number-soup instead of
    # citing the real GK Gulf band (220-280 SAR/m3) or refusing.
    prompt: "What is the unit rate for reinforced concrete (250 kg/cm2) in Saudi Arabia? Give SAR per m3 and cite your source."
    answer_expect:
      - '(22[0-9]|2[3-7][0-9]|280|indicative|supplier quote|priced BOQ|rate schedule|do(?:es)?n.?t have|no rate|cannot|could ?n.?t|unable)'
    answer_reject:
      - '450\s*(?:SAR|/\s*m|per\s*m)'
      - 'SAR\s*450'
